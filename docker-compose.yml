# ─────────────────────────────────────────────────────────────────────
# Agentic RAG Backend — Docker Compose
# Hybrid mode by default: docker-compose up postgres redis minio
# Then run uvicorn + worker natively on host for fast iteration.
# Full-stack mode: docker compose up --build (also starts api + worker)
# ─────────────────────────────────────────────────────────────────────
services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentic_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agentic_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agentic-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  
  minio:
    # Local S3-compatible object storage
    image: chainguard/minio:latest
    container_name: agentic-rag-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
        test: ["CMD", "/bin/sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s



  # Uncomment the two blocks below to run everything in Docker.
  # For local dev, run uvicorn + worker on host (faster code reload).
  #
  # api:
  #   build: .
  #   container_name: agentic-rag-api
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://app:password@postgres:5432/agentic_rag
  #     REDIS_URL: redis://redis:6379/0
  #     S3_ENDPOINT_URL: http://minio:9000
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }
  #     minio:     { condition: service_healthy }
  #
  # worker:
  #   build: .
  #   container_name: agentic-rag-worker
  #   restart: unless-stopped
  #   env_file: .env
  #   command: ["python", "workers/run_worker.py"]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://app:password@postgres:5432/agentic_rag
  #     REDIS_URL: redis://redis:6379/0
  #     S3_ENDPOINT_URL: http://minio:9000
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }
  #     minio:     { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  minio_data: